name: Cloudflare SSH + Debian 12 Lab

on: workflow_dispatch

jobs:
  lab-wibu:
    runs-on: ubuntu-latest

    steps:
      # 1. Setup Password User & SSH Server
      - name: Setup SSH & Password
        run: |
          # Set password runner jadi 123
          echo "runner:123" | sudo chpasswd
          
          # Install & Config SSH
          sudo apt-get update
          sudo apt-get install -y openssh-server
          
          # Paksa bolehin password login
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart
          echo "✅ SSH Ready. User: runner | Pass: 123"

      # 2. Spawn Debian 12 Container (Biar pas lu masuk lgsg ada)
      - name: Start Debian 12 Container
        run: |
          # Jalanin Debian 12 mode background (detached)
          # Pake --net host biar gampang akses internet
          # Pake --privileged biar lu leluasa opreknya
          docker run -itd \
            --name debian-sakti \
            --privileged \
            --net host \
            debian:12 \
            bash
            
          echo "✅ Container 'debian-sakti' udah jalan!"

      # 3. Jalanin Cloudflare Tunnel
      - name: Start Cloudflared
        run: |
          # Download Cloudflared
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          # Install Service pake Token lu
          sudo cloudflared service install ${{ secrets.CF_TOKEN }}
          
          # Start Service
          sudo service cloudflared start
          echo "🚀 Tunnel Konek! Cek domain yg lu set di dashboard Cloudflare."

      # 4. Tahan Session (Looping 6 Jam)
      - name: Keep Alive Loop
        run: |
          echo "⛔ MASUK SEKARANG!"
          echo "SSH User: runner"
          echo "SSH Pass: 123"
          echo "Host: (Domain yg lu setting di Cloudflare)"
          echo "=============================================="
          echo "💡 TIPS: Pas udah login SSH, ketik:"
          echo "   docker exec -it debian-sakti bash"
          echo "   (Buat masuk ke Debian 12 lu)"
          echo "=============================================="
          
          touch keep_alive
          while [ -f keep_alive ]; do sleep 60; done
        timeout-minutes: 360
