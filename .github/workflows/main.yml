name: Debug SSH (Simple Auth Key)

on: workflow_dispatch

jobs:
  tuyul-session:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: "gh-runner-simple"
          
      - name: Info & IP
        run: |
          echo "✅ Konek via Auth Key sukses!"
          tailscale ip -4
          echo "User: runner"
          sudo ps aux | grep tailscaled
      - name: Setup Password & SSH Config
        run: |
          # 1. Set password user 'runner' jadi '123' (ganti sesuka lu)
          echo "runner:123" | sudo chpasswd
          
          # 2. Install SSH Server (jaga-jaga kalo belum ada)
          sudo apt-get update -y
          sudo apt-get install -y openssh-server
          
          # 3. Paksa bolehin login pake password
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          
          # 4. Restart service SSH biar ngefek
          sudo service ssh restart
          
      - name: Tahan Session (Loop)
        run: |
          echo "🚀 Gass SSH ke IP di atas sekarang!"
          echo "Command di PC lu: ssh runner@<IP-TAILSCALE>"
          touch keep_alive
          while [ -f keep_alive ]; do sleep 60; done
        timeout-minutes: 60
