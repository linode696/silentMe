name: Debug SSH (Fix Version)

on: workflow_dispatch

jobs:
  tuyul-ngamuk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Password User
        run: |
          # Kita set password dulu sebelum tailscale jalan
          echo "runner:123" | sudo chpasswd
          sudo apt-get update
          sudo apt-get install -y openssh-server
          # Jebol config ssh biar boleh pass login
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart
          echo "✅ Password user 'runner' udah diset jadi '123'"

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: "gh-runner-fix"
          # INI PENTING: Kalo key lu ada tag-nya, ini wajib ada!
          args: --advertise-tags=tag:ci

      - name: Cek Status
        run: |
          echo "🔥 Konek!"
          tailscale ip -4
          echo "User: runner"
          echo "Pass: 123"

      - name: Tahan Session (1 Jam)
        run: |
          echo "🚀 Buruan SSH!"
          echo "ssh runner@<IP-TAILSCALE>"
          touch keep_alive
          while [ -f keep_alive ]; do sleep 60; done
        timeout-minutes: 60
